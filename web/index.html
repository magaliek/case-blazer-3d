<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLB test</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #eee; }
    model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
    #bar {
      position: fixed; left: 8px; right: 8px; top: 8px; z-index: 10;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      background: rgba(255,255,255,.9); padding: 6px 8px; border-radius: 8px; font-size: 13px;
    }
    button { padding: 6px 10px; }
    #status { flex: 1 1 100%; word-break: break-all; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>


  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xEDE8D0);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);

    const AmbientLight = new THREE.AmbientLight( 0xffffff, 0.75 );
    scene.add( AmbientLight );
    
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    const rDom = renderer.domElement;
    document.body.appendChild(rDom);

    const controls = new OrbitControls( camera, rDom );
    
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render( scene, camera );
    });

    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    loader.load(
      '/assets/blazer.glb',

      function(gltf) {

        const box = new THREE.Box3().setFromObject(gltf.scene);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        console.log(size, center);

        controls.target.copy(center);
        controls.minDistance = 0.5 * size.y;
        controls.maxDistance = 4 * size.y;
        controls.update();
        camera.position.copy(center);
        camera.position.z += 2.5 * size.y;
        
        camera.near = 0.01 * size.y;
        camera.far = 10 * size.y;
        camera.updateProjectionMatrix();


        scene.add(gltf.scene);
      },
      
      function(xhr) {
        if (xhr.total > 0) {
          const percentageCompleted = (xhr.loaded / xhr.total) * 100;
          console.log( `Model is ${ Math.round( percentageCompleted ) }% loaded` );
        } else {
            console.log( `Downloaded ${ ( xhr.loaded / 1024 / 1024 ).toFixed( 2 ) } MB` );
        }
      },

      function ( error ) {
        console.error( 'An error happened:', error );
    }

    )
    
  </script>
</body>
</html>
