<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blazer Configuration</title>
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #eee; }
    #bar {
      position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 10;
      display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap;
      max-height: 40vh; overflow-y: auto;
      background: rgba(255,255,255,.9); padding: 6px 8px; border-radius: 8px; font-size: 13px;
    }
    .group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    button { padding: 6px 10px; }
    button.active { background: #222; color: #fff; }
    #liningPicker { -webkit-appearance: none; appearance: none; width: 32px; height: 32px; padding: 0; border: 2px solid #999; border-radius: 50%; background: none; cursor: pointer; }
    #liningPicker::-webkit-color-swatch-wrapper { padding: 0; }
    #liningPicker::-webkit-color-swatch { border: none; border-radius: 50%; }
    #liningPicker::-moz-color-swatch { border: none; border-radius: 50%; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="bar">
    <div class="group">Fabrics
      <button data-option="fabric" data-value="wool">Wool fabric</button>
      <button data-option="fabric" data-value="stripe">Stripe fabric</button>
      <button data-option="fabric" data-value="check">Checkers fabric</button>
    </div>

    <div class="group">Buttons
      <button data-option="buttons" data-value="0">No buttons</button>
      <button data-option="buttons" data-value="2">2 button closure</button>
      <button data-option="buttons" data-value="3">3 button closure</button>
    </div>

    <div class="group">Flap pockets
      <button data-option="flapPockets" data-value="0">Off</button>
      <button data-option="flapPockets" data-value="1">Only left side</button>
      <button data-option="flapPockets" data-value="2">Only right side</button>
      <button data-option="flapPockets" data-value="3">Both sides</button>
    </div>

    <div class="group">Chest patch pocket
      <button data-option="patchPocket" data-value="true">On</button>
      <button data-option="patchPocket" data-value="false">Off</button>
    </div>

    <div class="group">Lining
      <input type="color" id="liningPicker" value="#228B22">
    </div>

    <button id="reset">Reset view</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
